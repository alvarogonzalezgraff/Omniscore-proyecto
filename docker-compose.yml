version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: betwin_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: betwin_db
    ports:
      - "5433:5432"
    volumes:
      - betwin_postgres_data:/var/lib/postgresql/data

volumes:
  betwin_postgres_data:
    external: true
